name: ML pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        run: dvc pull

      - name: Run tests
        run: pytest tests/ -v

  train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        run: dvc pull

      # train.py exits with 1 if the metrics are below the thresholds in the config
      - name: Train model and check thresholds
        run: python -m src.train --config configs/config.yaml --run-name final_model

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.joblib
            reports/metrics.json
